name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build executable
        run: python -m PyInstaller --noconsole --onefile --clean --name "PDF水印助手" main.py

      - name: Verify executable
        shell: powershell
        run: |
          $artifact = "dist/PDF水印助手.exe"
          if (-not (Test-Path $artifact)) {
            throw "Build artifact was not created: $artifact"
          }
          Get-Item $artifact | Format-List FullName,Length,LastWriteTime

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }
          gh release create $tag "dist/PDF水印助手.exe" --title "PDF 水印助手 $tag" --generate-notes
